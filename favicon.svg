<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" color="#f6f1e6"><defs>
  <!-- the shamrock, engraved: one fine outline of three heart leaves and a stem, with a vein in each leaf; drawn in currentColor -->
  <path id="lf" d="M50 51C45 46 32 40 30.5 28 29.5 19 35 13.5 41 13.5 45.5 13.5 49 16.5 50 21 51 16.5 54.5 13.5 59 13.5 65 13.5 70.5 19 69.5 28 68 40 55 46 50 51Z"/>
  <g id="sham-shape">
    <use href="#lf"/><use href="#lf" transform="rotate(120 50 52)"/><use href="#lf" transform="rotate(-120 50 52)"/>
    <path id="sham-stem" d="M47.6 54C48.2 67 51.6 80.5 59.6 93.4c1.2 1.9 4.2.9 3.6-1.3C59.5 79.2 55.8 66.6 53.6 53.6Z"/>
    <circle cx="50" cy="52" r="4.6"/>
  </g>
  <filter id="sham-line" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceGraphic" operator="dilate" radius="3.6" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out"/></filter>
  <g id="shamrock">
    <g filter="url(#sham-line)" fill="currentColor"><use href="#sham-shape"/></g>
    <mask id="sham-under" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><use href="#sham-stem" fill="#fff"/><circle cx="50" cy="52" r="5.2" fill="#000"/></mask>
    <g mask="url(#sham-under)"><g filter="url(#sham-line)" fill="currentColor"><use href="#lf" transform="rotate(120 50 52)"/><use href="#lf" transform="rotate(-120 50 52)"/></g></g>
    <g stroke="currentColor" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".75"><path id="vein" d="M50 47V25"/><use href="#vein" transform="rotate(120 50 52)"/><use href="#vein" transform="rotate(-120 50 52)"/></g>
  </g>
</defs>
<rect width="100" height="100" rx="22" fill="#0f4434"/><g transform="translate(13 11) scale(.74)"><use href="#shamrock"/></g></svg>
